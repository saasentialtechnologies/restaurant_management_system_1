<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Table Self-Ordering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>.touch-action-manipulation { touch-action: manipulation; }</style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans touch-action-manipulation select-none min-h-screen pb-20">

  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-30 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="bg-emerald-500 text-slate-900 w-10 h-10 rounded-xl flex items-center justify-center font-black text-xl"><i class="fa-solid fa-utensils"></i></div>
      <div>
        <h1 class="font-bold text-base text-white" id="branch-display">DHA Phase 6 Branch</h1>
        <p class="text-xs text-emerald-400 font-bold" id="table-display">Table 1</p>
      </div>
    </div>
    <div id="order-status-badge" class="bg-slate-700 border border-slate-600 text-slate-300 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Ready to Order
    </div>
  </header>

  <main class="p-4 grid grid-cols-12 gap-4 max-w-7xl mx-auto">
    <div class="col-span-12 lg:col-span-8 bg-slate-800/60 border border-slate-700 p-4 rounded-2xl">
      <h2 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Select Menu Items</h2>
      <div id="customer-menu-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-[70vh] overflow-y-auto p-1"></div>
    </div>

    <div class="col-span-12 lg:col-span-4 bg-slate-800 border border-slate-700 p-4 rounded-2xl flex flex-col justify-between">
      <div>
        <h2 class="text-base font-bold text-white border-b border-slate-700 pb-2 mb-3 flex justify-between items-center">
          <span>Your Cart</span>
          <span id="session-tag" class="text-[10px] text-slate-400 font-mono">--</span>
        </h2>
        <div id="customer-cart-list" class="space-y-2 max-h-52 overflow-y-auto mb-3">
          <p class="text-slate-500 text-xs text-center py-8">Tap dishes to add to cart.</p>
        </div>
      </div>

      <div class="border-t border-slate-700 pt-3 space-y-3">
        <div class="flex justify-between text-xl font-black text-white">
          <span>Total:</span>
          <span id="cart-total" class="text-emerald-400">Rs. 0</span>
        </div>
        <button onclick="placeTableOrder()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-black py-4 rounded-xl text-base shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> Place Order Now
        </button>
      </div>
    </div>
  </main>

  <script>
    const syncChannel = new BroadcastChannel('pakrms_drive_thru_bus');
    const urlParams = new URLSearchParams(window.location.search);
    const myBranch = urlParams.get('branch') || 'DHA Phase 6 Branch';
    const myTable = urlParams.get('table') || 'Table 1';

    document.getElementById('branch-display').innerText = myBranch;
    document.getElementById('table-display').innerText = myTable;

    let mySessionId = localStorage.getItem('pakrms_table_session') || 'SESS_' + Math.floor(Math.random()*899999 + 100000);
    localStorage.setItem('pakrms_table_session', mySessionId);
    document.getElementById('session-tag').innerText = '#' + mySessionId.slice(-6);

    let menuCatalog = JSON.parse(localStorage.getItem('pakrms_menu_catalog')) || [
      { id: 1, name: 'Special Chicken Biryani', price: 450, image: 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=500&auto=format&fit=crop&q=80' },
      { id: 2, name: 'Mutton Karahi (Half)', price: 1850, image: 'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=500&auto=format&fit=crop&q=80' },
      { id: 3, name: 'Zinger Burger Meal', price: 650, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop&q=80' }
    ];

    let cart = [];

    function renderMenu() {
      document.getElementById('customer-menu-grid').innerHTML = menuCatalog.map(m => `
        <div onclick="addToCart(${m.id})" class="bg-slate-900 border border-slate-700/80 p-2.5 rounded-xl cursor-pointer active:scale-95 transition-all flex flex-col justify-between">
          <div class="h-28 bg-slate-950 rounded-lg overflow-hidden mb-2"><img src="${m.image}" class="w-full h-full object-cover"></div>
          <p class="font-bold text-xs text-white">${m.name}</p>
          <p class="text-emerald-400 font-black text-xs mt-1">Rs. ${m.price}</p>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = menuCatalog.find(m => m.id === id);
      const exist = cart.find(c => c.id === id);
      if(exist) exist.qty++; else cart.push({ ...item, qty: 1 });
      updateCart();
    }

    function updateCart() {
      const list = document.getElementById('customer-cart-list');
      if(cart.length === 0) list.innerHTML = `<p class="text-slate-500 text-xs text-center py-8">Tap dishes to add to cart.</p>`;
      else {
        list.innerHTML = cart.map(c => `
          <div class="flex justify-between items-center text-xs border-b border-slate-700 pb-1.5">
            <div><span class="font-bold text-white">${c.name}</span> <span class="text-emerald-400">x${c.qty}</span></div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-300">Rs. ${c.price * c.qty}</span>
              <button onclick="cart = cart.filter(i=>i.id !== ${c.id}); updateCart();" class="text-rose-400 font-bold">&times;</button>
            </div>
          </div>
        `).join('');
      }
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('cart-total').innerText = `Rs. ${total}`;
    }

    function placeTableOrder() {
      if(cart.length === 0) return alert("Select items first!");
      const orderPayload = {
        type: 'NEW_ORDER_FROM_CUSTOMER',
        order: {
          id: Math.floor(Math.random() * 8999 + 1000),
          branch: myBranch,
          table: myTable,
          sessionId: mySessionId,
          items: [...cart],
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      };

      syncChannel.postMessage(orderPayload);
      document.getElementById('order-status-badge').innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> Sent to Kitchen`;

      cart = []; updateCart();
      alert(`Order sent to ${myBranch} Kitchen!`);
    }

    syncChannel.onmessage = (event) => {
      const { type, order } = event.data;
      if(order && order.sessionId === mySessionId && type === 'ORDER_COMPLETED_BY_KITCHEN') {
        document.getElementById('order-status-badge').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Order Served`;
        alert("🎉 Your Order is READY! Runner is serving your table.");
      }
    };

    renderMenu();
  </script>
</body>
</html>
