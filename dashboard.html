<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Reception POS Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4">

  <header class="bg-slate-900 text-white p-4 rounded-2xl mb-4 shadow flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">PakRMS - Main POS Dashboard</h1>
      <p class="text-xs text-slate-400">Reception Control Center</p>
    </div>
    <div class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1.5 rounded-lg font-bold">
      Live Sync Channel Active
    </div>
  </header>

  <main class="grid grid-cols-12 gap-4">
    <!-- INCOMING CUSTOMER ORDERS -->
    <div class="col-span-12 lg:col-span-6 bg-white p-4 rounded-2xl border shadow-sm">
      <h2 class="font-bold text-slate-900 border-b pb-2 mb-3 flex justify-between items-center">
        <span><i class="fa-solid fa-bell text-amber-500 mr-2"></i> Incoming Drive-Thru Orders</span>
        <span id="incoming-count" class="bg-amber-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </h2>
      <div id="incoming-orders-list" class="space-y-3">
        <p class="text-slate-400 text-xs text-center py-10">Waiting for customer orders from tables...</p>
      </div>
    </div>

    <!-- LIVE KITCHEN PIPELINE MONITOR -->
    <div class="col-span-12 lg:col-span-6 bg-white p-4 rounded-2xl border shadow-sm">
      <h2 class="font-bold text-slate-900 border-b pb-2 mb-3 flex justify-between items-center">
        <span><i class="fa-solid fa-fire text-indigo-500 mr-2"></i> Kitchen Active Pipeline</span>
        <span id="kitchen-pipeline-count" class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </h2>
      <div id="pipeline-orders-list" class="space-y-3">
        <p class="text-slate-400 text-xs text-center py-10">No active kitchen preparation running.</p>
      </div>
    </div>
  </main>

  <script>
    const syncChannel = new BroadcastChannel('pakrms_drive_thru_bus');
    let incomingOrders = [];
    let kitchenPipeline = [];

    function playAlertChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = 600; osc.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.3);
      } catch(e){}
    }

    syncChannel.onmessage = (event) => {
      const { type, order } = event.data;

      if(type === 'NEW_ORDER_FROM_CUSTOMER') {
        incomingOrders.push(order);
        playAlertChime();
        renderIncoming();
      } else if(type === 'ORDER_COMPLETED_BY_KITCHEN') {
        kitchenPipeline = kitchenPipeline.filter(o => o.id !== order.id);
        playAlertChime();
        renderPipeline();
        alert(`🔔 ALERT: Kitchen completed Order #${order.id} for ${order.table}!`);
      }
    };

    function renderIncoming() {
      document.getElementById('incoming-count').innerText = incomingOrders.length;
      const list = document.getElementById('incoming-orders-list');
      if(incomingOrders.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-xs text-center py-10">Waiting for customer orders from tables...</p>`;
        return;
      }
      list.innerHTML = incomingOrders.map(ord => `
        <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl">
          <div class="flex justify-between items-center mb-2 font-bold text-xs text-slate-900">
            <span>#${ord.id} (${ord.table})</span>
            <span class="text-amber-700">${ord.time}</span>
          </div>
          <p class="text-xs text-slate-600 mb-2">${ord.items.map(i=>`${i.name} x${i.qty}`).join(', ')}</p>
          <button onclick="forwardToKitchen(${ord.id})" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 rounded-lg text-xs transition-all">
            Approve & Dispatch to Kitchen <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>
      `).join('');
    }

    function forwardToKitchen(orderId) {
      const ord = incomingOrders.find(o => o.id === orderId);
      if(!ord) return;

      incomingOrders = incomingOrders.filter(o => o.id !== orderId);
      kitchenPipeline.push(ord);

      syncChannel.postMessage({ type: 'ORDER_FORWARDED_TO_KITCHEN', order: ord });

      renderIncoming();
      renderPipeline();
    }

    function renderPipeline() {
      document.getElementById('kitchen-pipeline-count').innerText = kitchenPipeline.length;
      const list = document.getElementById('pipeline-orders-list');
      if(kitchenPipeline.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-xs text-center py-10">No active kitchen preparation running.</p>`;
        return;
      }
      list.innerHTML = kitchenPipeline.map(ord => `
        <div class="bg-indigo-50 border border-indigo-200 p-3 rounded-xl flex justify-between items-center">
          <div>
            <p class="font-bold text-xs text-indigo-900">#${ord.id} - ${ord.table}</p>
            <p class="text-[11px] text-slate-600">${ord.items.map(i=>`${i.name} x${i.qty}`).join(', ')}</p>
          </div>
          <span class="text-xs font-bold text-indigo-600 bg-indigo-100 px-2 py-1 rounded">Preparing...</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
