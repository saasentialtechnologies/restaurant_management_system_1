<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Display Screen (KDS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white font-sans p-6 min-h-screen">

  <header class="border-b border-slate-800 pb-4 mb-6 flex justify-between items-center">
    <h1 class="text-2xl font-black text-emerald-400 flex items-center gap-3">
      <i class="fa-solid fa-tv"></i> LIVE KITCHEN DISPLAY
    </h1>
    <div id="kds-count" class="bg-emerald-500 text-slate-950 px-3 py-1 rounded-full font-black text-sm">
      0 ACTIVE
    </div>
  </header>

  <div id="kitchen-cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="col-span-3 text-center text-slate-600 font-bold py-20">
      Kitchen Queue Clear. Waiting for orders from Dashboard...
    </div>
  </div>

  <script>
    const syncChannel = new BroadcastChannel('pakrms_drive_thru_bus');
    let activeKitchenOrders = [];

    function playKitchenChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = 800; osc.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch(e){}
    }

    syncChannel.onmessage = (event) => {
      const { type, order } = event.data;
      if(type === 'ORDER_FORWARDED_TO_KITCHEN') {
        activeKitchenOrders.push(order);
        playKitchenChime();
        renderKDS();
      }
    };

    function renderKDS() {
      document.getElementById('kds-count').innerText = `${activeKitchenOrders.length} ACTIVE`;
      const container = document.getElementById('kitchen-cards-container');
      if(activeKitchenOrders.length === 0) {
        container.innerHTML = `<div class="col-span-3 text-center text-slate-600 font-bold py-20">Kitchen Queue Clear. Waiting for orders from Dashboard...</div>`;
        return;
      }
      container.innerHTML = activeKitchenOrders.map(ord => `
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-3">
              <span class="font-black text-xl text-white">#${ord.id}</span>
              <span class="bg-emerald-500/20 text-emerald-400 font-bold text-xs px-2.5 py-1 rounded-lg border border-emerald-500/30">${ord.table}</span>
            </div>
            <ul class="space-y-2 mb-4">
              ${ord.items.map(i => `<li class="flex justify-between text-sm"><span>${i.name}</span><b class="text-emerald-400">x${i.qty}</b></li>`).join('')}
            </ul>
            ${ord.note ? `<p class="text-xs bg-amber-500/10 text-amber-400 p-2 rounded-lg border border-amber-500/20 mb-4">Note: ${ord.note}</p>` : ''}
          </div>
          <button onclick="markOrderDone(${ord.id})" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3 rounded-xl text-sm transition-all active:scale-95">
            MARK READY / DONE
          </button>
        </div>
      `).join('');
    }

    function markOrderDone(orderId) {
      const ord = activeKitchenOrders.find(o => o.id === orderId);
      if(!ord) return;

      activeKitchenOrders = activeKitchenOrders.filter(o => o.id !== orderId);

      // Broadcast order complete notification to Dashboard & Customer Screen
      syncChannel.postMessage({ type: 'ORDER_COMPLETED_BY_KITCHEN', order: ord });

      renderKDS();
    }
  </script>
</body>
</html>
